# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
title: Junteng Liu
title_separator: "-"
subtitle: "PhD Candidate in NLP"
name: Junteng Liu
description: Personal homepage of Junteng Liu, PhD candidate at HKUST NLP Group.
url: "https://agendusyymw.github.io"
baseurl: "/LJT-Homepage"
repository: "agendusyymw/LJT-Homepage"

words_per_minute: 200
enable_copy_code_button: true

# -----------------------------------------------------------------------------
# Author
# -----------------------------------------------------------------------------
author:
  name: "Junteng Liu"
  avatar: "profile.png"
  bio: "First-year PhD candidate at HKUST NLP Group, advised by Prof. Junxian He. Research interests: LLM Reasoning & RL, VLM Hallucination, LLM Truthfulness & Interpretability."
  location: "Hong Kong, China"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  github: Vicent0205
  google_scholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: junteng88716710

# -----------------------------------------------------------------------------
# Footer
# -----------------------------------------------------------------------------
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"

# -----------------------------------------------------------------------------
# Reading files
# -----------------------------------------------------------------------------
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - docker-compose.yaml
  - Dockerfile
  - .github
  - README.md
  - LICENSE
  - talkmap.ipynb
  - talkmap.py
  - talkmap
  - talkmap_out.ipynb
  - _posts
  - _talks
  - _teaching
  - _portfolio
  - _drafts
  - markdown_generator
  - scripts
  - files

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  publications:
    output: true
    permalink: /publications/:path/

# -----------------------------------------------------------------------------
# Defaults
# -----------------------------------------------------------------------------
defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# -----------------------------------------------------------------------------
# Markdown / Output
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter_opts:
    block:
      line_numbers: false

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

paginate: 5
paginate_path: /page:num/

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
minimal_mistakes_skin: "default"

# Search, analytics, comments
search: true
lunr:
  search_within_pages: true
comments:
  provider: false
analytics:
  provider: false

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

future: false
